<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid system</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-6"  style="color: aqua; background-color: black;">jay shree ram</div>
            <div class="col-sm-9" style="color: aqua; background-color: black;">jay shree ram</div>
            <div class="col-sm-5" style="color: aqua; background-color: black;">jay shree ram</div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-lg-5" style="background-color: blue;">uyggu</div>
            <div class="col-lg-2" style="background-color: blue;">uyggu</div>

            <div class="col-lg-12" style="background-color: blue;">this is container </div>

        </div>
    </div>

    <div class="container-fluid">
        <div class="row g-3">
            <div class="col-lg-5" style="background-color: green;">uyggu</div>
            <div class="col-lg-2" style="background-color: green;">uyggu</div>
            <div class="col-lg-12" style="background-color: green;">this is container-fluid (takes full height and width)</div>

        </div>
    </div>

    <div class="container">
        <div class="row g-5"> <!-- gives gap between two cols-->
            <div class="col-sm-12 col-md-6 col-lg-4 bg-primary text-white">Column 1</div>
            <div class="col-sm-12 col-md-6 col-lg-4 bg-success text-white">Column 2</div>
            <div class="col-sm-12 col-md-6 col-lg-4 bg-danger text-white">Column 3</div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-4 offset-md-2" style="background-color: cadetblue;">bagva rang</div> <!-- offset-md-2 is used to give margin to the left side -->
        </div>
    </div>
</body>
</html>
